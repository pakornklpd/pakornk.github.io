<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UBRU Space Shooter Arcade - Neon Defender</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Press+Start+2P&display=swap');

        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            font-family: 'Orbitron', sans-serif;
            background-color: #05020c;
            overflow: hidden;
        }

        .neon-glow-cyan {
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.6), inset 0 0 10px rgba(6, 182, 212, 0.3);
            border: 2px solid rgba(6, 182, 212, 0.8);
        }

        .neon-text-cyan {
            text-shadow: 0 0 8px rgba(6, 182, 212, 0.8), 0 0 16px rgba(6, 182, 212, 0.4);
        }

        .neon-text-red {
            text-shadow: 0 0 8px rgba(239, 68, 68, 0.8), 0 0 16px rgba(239, 68, 68, 0.4);
        }

        .neon-text-purple {
            text-shadow: 0 0 8px rgba(168, 85, 247, 0.8), 0 0 16px rgba(168, 85, 247, 0.4);
        }

        .glass-overlay {
            background: rgba(10, 5, 25, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col items-center justify-center relative bg-black text-white">

    <!-- Game Top HUD -->
    <div id="hud" class="w-full max-w-lg px-4 py-2 flex justify-between items-center z-10 text-xs md:text-sm">
        <!-- Score -->
        <div class="flex flex-col">
            <span class="text-[10px] text-cyan-400 font-bold tracking-wider">SCORE</span>
            <span id="score-display" class="font-black text-yellow-400 text-base md:text-lg">0</span>
        </div>

        <!-- High Score -->
        <div class="flex flex-col items-center">
            <span class="text-[10px] text-purple-400 font-bold tracking-wider">HIGH SCORE</span>
            <span id="highscore-display" class="font-black text-purple-300 text-base md:text-lg">0</span>
        </div>

        <!-- Lives -->
        <div class="flex flex-col items-end">
            <span class="text-[10px] text-red-400 font-bold tracking-wider">LIVES</span>
            <div id="lives-container" class="flex gap-1 mt-1">
                <!-- Hearts rendered dynamically -->
            </div>
        </div>
    </div>

    <!-- Canvas Game Viewport -->
    <div class="relative w-full max-w-lg flex flex-col items-center justify-center p-2">
        <canvas id="gameCanvas" class="rounded-xl neon-glow-cyan block cursor-crosshair bg-black"></canvas>

        <!-- Start Overlay Screen -->
        <div id="start-screen" class="absolute inset-0 z-20 glass-overlay rounded-xl flex flex-col items-center justify-center p-6 text-center">
            <h1 class="text-3xl md:text-4xl font-black text-cyan-400 neon-text-cyan mb-2 tracking-wider">
                UBRU SPACE DEFENDER
            </h1>
            <p class="text-xs text-purple-300 mb-6 font-semibold tracking-widest">EASY ASTEROID MODE</p>

            <div class="space-y-2 mb-8 text-left text-xs text-slate-300 bg-slate-900/80 p-4 rounded-lg border border-cyan-500/30 w-full max-w-xs">
                <p class="flex items-center gap-2"><span class="text-cyan-400 font-bold">🎯 MOVE:</span> Arrow Keys / WASD / Mouse / Touch</p>
                <p class="flex items-center gap-2"><span class="text-cyan-400 font-bold">⚡ SHOOT:</span> Auto Fire / Spacebar</p>
                <p class="flex items-center gap-2"><span class="text-red-400 font-bold">👾 ENEMIES:</span> Red Neon Enemy Ships</p>
                <p class="flex items-center gap-2"><span class="text-amber-400 font-bold">🪨 ASTEROIDS:</span> Slower & Reduced count!</p>
            </div>

            <button id="start-btn" class="px-8 py-3.5 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-black font-black rounded-xl shadow-lg shadow-cyan-500/50 transform transition active:scale-95 text-sm tracking-widest">
                LAUNCH MISSION
            </button>
        </div>

        <!-- Game Over Screen -->
        <div id="gameover-screen" class="absolute inset-0 z-20 glass-overlay rounded-xl flex flex-col items-center justify-center p-6 text-center hidden">
            <h2 id="gameover-title" class="text-3xl md:text-4xl font-black text-red-500 neon-text-red mb-4">GAME OVER</h2>
            
            <div class="bg-slate-900/90 p-5 rounded-xl border border-purple-500/30 max-w-xs w-full mb-8 space-y-4 text-xs font-bold">
                <div class="flex justify-between items-center">
                    <span class="text-slate-400">FINAL SCORE</span>
                    <span id="final-score" class="text-yellow-400 text-base">0</span>
                </div>
                <div class="flex justify-between items-center border-t border-slate-800 pt-3">
                    <span class="text-slate-400">BEST RECORD</span>
                    <span id="final-highscore" class="text-purple-400 text-base">0</span>
                </div>
            </div>

            <button id="restart-btn" class="px-8 py-3.5 bg-gradient-to-r from-yellow-400 to-amber-500 hover:from-yellow-300 hover:to-amber-400 text-black font-black rounded-xl shadow-lg shadow-amber-500/50 transform transition active:scale-95 text-sm tracking-widest">
                PLAY AGAIN
            </button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI References
        const scoreDisplay = document.getElementById('score-display');
        const highscoreDisplay = document.getElementById('highscore-display');
        const livesContainer = document.getElementById('lives-container');
        const startScreen = document.getElementById('start-screen');
        const gameoverScreen = document.getElementById('gameover-screen');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const finalScore = document.getElementById('final-score');
        const finalHighscore = document.getElementById('final-highscore');

        // Web Audio Synthesizer
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSynthSound(type) {
            if (!audioCtx) return;
            try {
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'laser') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(800, now);
                    osc.frequency.exponentialRampToValueAtTime(100, now + 0.12);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
                    osc.start(now);
                    osc.stop(now + 0.12);
                } else if (type === 'asteroidHit') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(180, now);
                    osc.frequency.exponentialRampToValueAtTime(40, now + 0.15);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'explosion') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(120, now);
                    osc.frequency.linearRampToValueAtTime(20, now + 0.35);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
                    osc.start(now);
                    osc.stop(now + 0.35);
                } else if (type === 'playerHit') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.linearRampToValueAtTime(50, now + 0.5);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                }
            } catch (e) {}
        }

        // Game State Variables
        let score = 0;
        let highScore = localStorage.getItem('spaceshooter_highscore') || 0;
        let lives = 3;
        let isPlaying = false;
        let screenShake = 0;
        let fireCooldown = 0;
        let asteroidSpawnTimer = 0;

        // Difficulty Tuners for Asteroids
        const MAX_ACTIVE_ASTEROIDS = 2; // Capped at 2 maximum active asteroids
        const ASTEROID_SPAWN_INTERVAL = 320; // Spawns roughly every 5.3 seconds at 60fps

        highscoreDisplay.textContent = highScore;

        function resizeCanvas() {
            const containerWidth = Math.min(window.innerWidth - 16, 480);
            const containerHeight = Math.min(window.innerHeight - 100, 640);
            canvas.width = containerWidth;
            canvas.height = containerHeight;
        }

        class Star {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speed = Math.random() * 2 + 0.5;
                this.alpha = Math.random() * 0.8 + 0.2;
            }
            update() {
                this.y += this.speed;
                if (this.y > canvas.height) {
                    this.y = 0;
                    this.x = Math.random() * canvas.width;
                }
            }
            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                ctx.fillRect(this.x, this.y, this.size, this.size);
            }
        }

        class Player {
            constructor() {
                this.width = 32;
                this.height = 36;
                this.x = canvas.width / 2;
                this.y = canvas.height - 60;
                this.speed = 6;
            }

            reset() {
                this.x = canvas.width / 2;
                this.y = canvas.height - 60;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                ctx.shadowBlur = 15;
                ctx.shadowColor = '#06b6d4';

                ctx.strokeStyle = '#06b6d4';
                ctx.fillStyle = '#0f172a';
                ctx.lineWidth = 2.5;

                ctx.beginPath();
                ctx.moveTo(0, -this.height / 2);
                ctx.lineTo(this.width / 2, this.height / 2);
                ctx.lineTo(this.width / 4, this.height / 3);
                ctx.lineTo(0, this.height / 2);
                ctx.lineTo(-this.width / 4, this.height / 3);
                ctx.lineTo(-this.width / 2, this.height / 2);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#38bdf8';
                ctx.shadowColor = '#38bdf8';
                ctx.beginPath();
                ctx.moveTo(-4, this.height / 3 + 2);
                ctx.lineTo(0, this.height / 2 + Math.random() * 8 + 4);
                ctx.lineTo(4, this.height / 3 + 2);
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            }
        }

        class Laser {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.speed = 10;
                this.radius = 3;
            }
            update() {
                this.y -= this.speed;
            }
            draw() {
                ctx.save();
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#38bdf8';
                ctx.fillStyle = '#f0f9ff';
                ctx.fillRect(this.x - 2, this.y, 4, 12);
                ctx.restore();
            }
        }

        // Tuned Slower Asteroid Class
        class Asteroid {
            constructor(x, y, radius = 26) {
                this.x = x || Math.random() * (canvas.width - 60) + 30;
                this.y = y || -40;
                this.radius = radius;
                this.speedY = Math.random() * 0.7 + 0.6; // Reduced speed: 0.6 - 1.3 px/frame
                this.speedX = (Math.random() - 0.5) * 0.6;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.02;
                this.hp = Math.ceil(this.radius / 12);

                this.numVertices = Math.floor(Math.random() * 3) + 7;
                this.offsets = [];
                for (let i = 0; i < this.numVertices; i++) {
                    this.offsets.push(Math.random() * 0.35 + 0.82);
                }
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.rotation += this.rotationSpeed;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);

                ctx.shadowBlur = 12;
                ctx.shadowColor = '#d97706';
                ctx.strokeStyle = '#f59e0b';
                ctx.fillStyle = '#1c1917';
                ctx.lineWidth = 2;

                ctx.beginPath();
                for (let i = 0; i < this.numVertices; i++) {
                    const angle = (i / this.numVertices) * Math.PI * 2;
                    const r = this.radius * this.offsets[i];
                    const vx = Math.cos(angle) * r;
                    const vy = Math.sin(angle) * r;
                    if (i === 0) ctx.moveTo(vx, vy);
                    else ctx.lineTo(vx, vy);
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.restore();
            }
        }

        class Enemy {
            constructor() {
                this.width = 28;
                this.height = 28;
                this.x = Math.random() * (canvas.width - 40) + 20;
                this.y = -30;
                this.speed = Math.random() * 1.5 + 1.2;
            }

            update() {
                this.y += this.speed;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                ctx.shadowBlur = 12;
                ctx.shadowColor = '#ef4444';
                ctx.strokeStyle = '#ef4444';
                ctx.fillStyle = '#450a0a';
                ctx.lineWidth = 2;

                ctx.beginPath();
                ctx.moveTo(0, this.height / 2);
                ctx.lineTo(this.width / 2, -this.height / 2);
                ctx.lineTo(0, -this.height / 4);
                ctx.lineTo(-this.width / 2, -this.height / 2);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.radius = Math.random() * 2.5 + 1;
                this.vx = (Math.random() - 0.5) * 5;
                this.vy = (Math.random() - 0.5) * 5;
                this.life = 1.0;
                this.decay = Math.random() * 0.04 + 0.02;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 6;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        const stars = Array.from({ length: 40 }, () => new Star());
        const player = new Player();
        let lasers = [];
        let asteroids = [];
        let enemies = [];
        let particles = [];

        const keys = {};
        let isTouching = false;
        let touchX = 0;

        window.addEventListener('keydown', (e) => {
            initAudio();
            keys[e.key] = true;
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        canvas.addEventListener('touchstart', (e) => {
            initAudio();
            isTouching = true;
            touchX = e.touches[0].clientX - canvas.getBoundingClientRect().left;
        }, { passive: true });

        canvas.addEventListener('touchmove', (e) => {
            if (isTouching) {
                touchX = e.touches[0].clientX - canvas.getBoundingClientRect().left;
            }
        }, { passive: true });

        canvas.addEventListener('touchend', () => { isTouching = false; });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            touchX = e.clientX - rect.left;
            if (isPlaying) player.x = touchX;
        });

        function spawnParticles(x, y, color, count = 12) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function updateLivesDisplay() {
            let html = '';
            for (let i = 0; i < lives; i++) {
                html += `<span class="text-red-500 neon-text-red text-base">❤️</span>`;
            }
            livesContainer.innerHTML = html;
        }

        function updateGame() {
            if (!isPlaying) return;

            // Player movement
            if ((keys['ArrowLeft'] || keys['a'] || keys['A']) && player.x > player.width / 2) {
                player.x -= player.speed;
            }
            if ((keys['ArrowRight'] || keys['d'] || keys['D']) && player.x < canvas.width - player.width / 2) {
                player.x += player.speed;
            }
            if (isTouching) {
                player.x += (touchX - player.x) * 0.2;
            }

            // Auto-fire
            fireCooldown--;
            if (fireCooldown <= 0) {
                lasers.push(new Laser(player.x, player.y - player.height / 2));
                playSynthSound('laser');
                fireCooldown = 12;
            }

            lasers.forEach((laser, index) => {
                laser.update();
                if (laser.y < -10) lasers.splice(index, 1);
            });

            // Enemy Spawning
            if (Math.random() < 0.02) enemies.push(new Enemy());

            // Controlled Asteroid Spawning (Capped at MAX_ACTIVE_ASTEROIDS & timed interval)
            asteroidSpawnTimer++;
            if (asteroidSpawnTimer >= ASTEROID_SPAWN_INTERVAL) {
                if (asteroids.length < MAX_ACTIVE_ASTEROIDS) {
                    asteroids.push(new Asteroid());
                }
                asteroidSpawnTimer = 0;
            }

            // Update Asteroids & Collision Detection
            asteroids.forEach((ast, aIndex) => {
                ast.update();

                lasers.forEach((laser, lIndex) => {
                    const dist = Math.hypot(laser.x - ast.x, laser.y - ast.y);
                    if (dist < ast.radius + laser.radius) {
                        lasers.splice(lIndex, 1);
                        ast.hp--;
                        playSynthSound('asteroidHit');
                        spawnParticles(laser.x, laser.y, '#f59e0b', 4);

                        if (ast.hp <= 0) {
                            spawnParticles(ast.x, ast.y, '#f59e0b', 16);
                            playSynthSound('explosion');
                            score += Math.round(ast.radius);
                            scoreDisplay.textContent = score;

                            // Small split only if initial large asteroid
                            if (ast.radius > 20) {
                                asteroids.push(new Asteroid(ast.x, ast.y, 12));
                            }
                            asteroids.splice(aIndex, 1);
                        }
                    }
                });

                const playerDist = Math.hypot(player.x - ast.x, player.y - ast.y);
                if (playerDist < ast.radius + player.width / 3) {
                    spawnParticles(ast.x, ast.y, '#f59e0b', 20);
                    asteroids.splice(aIndex, 1);
                    handlePlayerDamage();
                }

                if (ast.y > canvas.height + 40) asteroids.splice(aIndex, 1);
            });

            // Update Enemies
            enemies.forEach((enemy, eIndex) => {
                enemy.update();

                lasers.forEach((laser, lIndex) => {
                    const dist = Math.hypot(laser.x - enemy.x, laser.y - enemy.y);
                    if (dist < enemy.width / 2 + laser.radius) {
                        spawnParticles(enemy.x, enemy.y, '#ef4444', 16);
                        playSynthSound('explosion');
                        score += 100;
                        scoreDisplay.textContent = score;
                        lasers.splice(lIndex, 1);
                        enemies.splice(eIndex, 1);
                    }
                });

                const pDist = Math.hypot(player.x - enemy.x, player.y - enemy.y);
                if (pDist < enemy.width / 2 + player.width / 3) {
                    spawnParticles(enemy.x, enemy.y, '#ef4444', 20);
                    enemies.splice(eIndex, 1);
                    handlePlayerDamage();
                }

                if (enemy.y > canvas.height + 30) enemies.splice(eIndex, 1);
            });

            particles.forEach((p, index) => {
                p.update();
                if (p.life <= 0) particles.splice(index, 1);
            });

            if (screenShake > 0) screenShake *= 0.85;
        }

        function handlePlayerDamage() {
            lives--;
            screenShake = 15;
            playSynthSound('playerHit');
            updateLivesDisplay();

            if (lives <= 0) {
                gameOver();
            }
        }

        function render() {
            ctx.save();

            if (screenShake > 0.5) {
                ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            stars.forEach(star => {
                star.update();
                star.draw();
            });

            if (isPlaying) {
                lasers.forEach(laser => laser.draw());
                asteroids.forEach(ast => ast.draw());
                enemies.forEach(enemy => enemy.draw());
                player.draw();
                particles.forEach(p => p.draw());
            }

            ctx.restore();
        }

        function gameLoop() {
            updateGame();
            render();
            requestAnimationFrame(gameLoop);
        }

        function startNewGame() {
            initAudio();
            resizeCanvas();
            score = 0;
            lives = 3;
            scoreDisplay.textContent = '0';
            updateLivesDisplay();

            lasers = [];
            asteroids = [];
            enemies = [];
            particles = [];
            asteroidSpawnTimer = 0;
            player.reset();

            startScreen.classList.add('hidden');
            gameoverScreen.classList.add('hidden');
            isPlaying = true;
        }

        function gameOver() {
            isPlaying = false;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('spaceshooter_highscore', highScore);
                highscoreDisplay.textContent = highScore;
            }

            finalScore.textContent = score;
            finalHighscore.textContent = highScore;
            gameoverScreen.classList.remove('hidden');
        }

        startBtn.addEventListener('click', startNewGame);
        restartBtn.addEventListener('click', startNewGame);
        window.addEventListener('resize', resizeCanvas);

        window.onload = () => {
            resizeCanvas();
            updateLivesDisplay();
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
</html>
