<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Space Shooter Arcade</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            font-family: 'Orbitron', sans-serif;
            background-color: #05030a;
            overflow: hidden;
        }

        .neon-text-cyan {
            text-shadow: 0 0 8px rgba(6, 182, 212, 0.8), 0 0 18px rgba(6, 182, 212, 0.5);
        }

        .neon-text-red {
            text-shadow: 0 0 8px rgba(239, 68, 68, 0.8), 0 0 18px rgba(239, 68, 68, 0.5);
        }

        .neon-text-purple {
            text-shadow: 0 0 8px rgba(168, 85, 247, 0.8), 0 0 18px rgba(168, 85, 247, 0.5);
        }

        .neon-box-purple {
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4), inset 0 0 15px rgba(168, 85, 247, 0.2);
            border: 1px solid rgba(168, 85, 247, 0.6);
        }

        /* Glassmorphism overlays */
        .glass-panel {
            background: rgba(13, 10, 26, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col items-center justify-center relative bg-slate-950 text-white">

    <!-- HUD Header -->
    <div id="hud" class="absolute top-0 left-0 w-full max-w-lg p-4 flex justify-between items-center z-10 pointer-events-none">
        <!-- Score -->
        <div class="flex flex-col">
            <span class="text-xs uppercase tracking-widest text-cyan-400 font-semibold">Score</span>
            <span id="score-display" class="text-2xl font-black text-white neon-text-cyan">0</span>
        </div>

        <!-- Title / HighScore -->
        <div class="text-center">
            <div class="text-xs uppercase tracking-widest text-purple-400">High Score</div>
            <div id="highscore-display" class="text-lg font-bold text-purple-300 neon-text-purple">0</div>
        </div>

        <!-- Lives Hearts -->
        <div class="flex flex-col items-end">
            <span class="text-xs uppercase tracking-widest text-red-400 font-semibold">Lives</span>
            <div id="lives-container" class="flex gap-1 mt-1 text-red-500 text-xl">
                <span>♥</span><span>♥</span><span>♥</span>
            </div>
        </div>
    </div>

    <!-- Game Container -->
    <div class="relative w-full h-full max-w-lg max-h-[850px] aspect-[4/5] flex items-center justify-center overflow-hidden shadow-2xl rounded-none md:rounded-2xl border-0 md:border md:border-purple-900/40">
        <canvas id="gameCanvas" class="w-full h-full block cursor-crosshair"></canvas>

        <!-- Start Screen -->
        <div id="start-screen" class="absolute inset-0 z-20 glass-panel flex flex-col items-center justify-center p-6 text-center">
            <h1 class="text-4xl md:text-5xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-purple-400 via-pink-500 to-cyan-400 mb-2 neon-text-purple">
                SPACE SHOOTER
            </h1>
            <p class="text-xs md:text-sm text-cyan-300 mb-8 tracking-widest">DEFEND THE GALAXY</p>

            <div class="space-y-3 mb-8 text-left text-xs text-slate-300 bg-slate-900/60 p-4 rounded-xl border border-purple-500/30 max-w-xs w-full">
                <p class="flex items-center gap-2"><span class="text-cyan-400 font-bold">← → / A D</span> Move Ship</p>
                <p class="flex items-center gap-2"><span class="text-cyan-400 font-bold">SPACE</span> Shoot Lasers</p>
                <p class="flex items-center gap-2"><span class="text-cyan-400 font-bold">Mouse / Touch</span> Drag to Aim & Move</p>
            </div>

            <button id="start-btn" class="w-48 py-3.5 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-bold rounded-xl shadow-lg transform transition active:scale-95 neon-box-purple uppercase tracking-widest text-sm">
                Start Mission
            </button>
        </div>

        <!-- Game Over Screen -->
        <div id="gameover-screen" class="absolute inset-0 z-20 glass-panel flex flex-col items-center justify-center p-6 text-center hidden">
            <h2 class="text-4xl font-black text-red-500 mb-2 neon-text-red tracking-widest">GAME OVER</h2>
            <p class="text-slate-400 text-sm mb-6">YOUR SHIP WAS DESTROYED</p>

            <div class="bg-slate-900/80 p-5 rounded-2xl border border-red-500/30 max-w-xs w-full mb-8 space-y-3">
                <div class="flex justify-between items-center text-sm">
                    <span class="text-slate-400">Final Score</span>
                    <span id="final-score" class="text-xl font-bold text-cyan-400">0</span>
                </div>
                <div class="flex justify-between items-center text-sm border-t border-slate-800 pt-2">
                    <span class="text-slate-400">Best Record</span>
                    <span id="final-highscore" class="text-xl font-bold text-purple-400">0</span>
                </div>
            </div>

            <button id="restart-btn" class="w-48 py-3.5 bg-gradient-to-r from-red-600 to-purple-600 hover:from-red-500 hover:to-purple-500 text-white font-bold rounded-xl shadow-lg transform transition active:scale-95 border border-red-500/50 uppercase tracking-widest text-sm">
                Play Again
            </button>
        </div>
    </div>

    <!-- On-screen Touch Controls for Mobile Devices -->
    <div id="touch-controls" class="md:hidden fixed bottom-3 left-0 w-full px-6 flex justify-between items-center pointer-events-none z-10 opacity-70">
        <div class="text-xs text-purple-300/60 bg-slate-900/40 px-3 py-1.5 rounded-full border border-purple-500/20">
            Drag screen to move & auto-fire
        </div>
    </div>

    <script>
        // Canvas setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI elements
        const scoreDisplay = document.getElementById('score-display');
        const highscoreDisplay = document.getElementById('highscore-display');
        const livesContainer = document.getElementById('lives-container');
        const startScreen = document.getElementById('start-screen');
        const gameoverScreen = document.getElementById('gameover-screen');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const finalScore = document.getElementById('final-score');
        const finalHighscore = document.getElementById('final-highscore');

        // Audio Context (Web Audio API Synthesizer)
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // Web Audio Sound Effects Synthesizer
        function playLaserSound() {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.15);
                
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch(e) {}
        }

        function playExplosionSound() {
            if (!audioCtx) return;
            try {
                // Buffer Noise generator for realistic crunch
                const bufferSize = audioCtx.sampleRate * 0.25;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(800, audioCtx.currentTime);
                filter.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.25);

                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);

                noise.start();
            } catch(e) {}
        }

        let gameWidth = 400;
        let gameHeight = 600;
        let isPlaying = false;
        let score = 0;
        let highScore = localStorage.getItem('space_shooter_highscore') || 0;
        let lives = 3;
        let lastTime = 0;
        let shootTimer = 0;
        let enemySpawnTimer = 0;

        highscoreDisplay.textContent = highScore;

        // Input Handling State
        const keys = {
            left: false,
            right: false,
            up: false,
            down: false,
            space: false
        };

        let touchX = null;
        let touchY = null;
        let isTouching = false;

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            gameWidth = canvas.width;
            gameHeight = canvas.height;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Star {
            constructor() {
                this.reset(true);
            }

            reset(initial = false) {
                this.x = Math.random() * gameWidth;
                this.y = initial ? Math.random() * gameHeight : -10;
                this.size = Math.random() * 2 + 0.5;
                this.speed = Math.random() * 1.5 + 0.5;
                this.color = Math.random() > 0.3 ? '#a855f7' : (Math.random() > 0.5 ? '#06b6d4' : '#ffffff');
                this.alpha = Math.random() * 0.8 + 0.2;
            }

            update() {
                this.y += this.speed;
                if (this.y > gameHeight) {
                    this.reset(false);
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.shadowBlur = this.size > 1.5 ? 6 : 0;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        const stars = Array.from({ length: 70 }, () => new Star());

        class Player {
            constructor() {
                this.width = 36;
                this.height = 42;
                this.x = gameWidth / 2;
                this.y = gameHeight - 80;
                this.speed = 6;
                this.invulnerableTimer = 0;
            }

            update() {
                // Keyboard Movement
                if (keys.left || keys.a) this.x -= this.speed;
                if (keys.right || keys.d) this.x += this.speed;
                if (keys.up || keys.w) this.y -= this.speed;
                if (keys.down || keys.s) this.y += this.speed;

                // Touch / Mouse Pointer Direct Movement
                if (isTouching && touchX !== null) {
                    const dx = touchX - this.x;
                    const dy = touchY - this.y;
                    this.x += dx * 0.15; // Smooth interpolation
                    this.y += dy * 0.15;
                }

                // Bounds restriction
                this.x = Math.max(this.width / 2, Math.min(gameWidth - this.width / 2, this.x));
                this.y = Math.max(this.height / 2, Math.min(gameHeight - this.height / 2, this.y));

                if (this.invulnerableTimer > 0) {
                    this.invulnerableTimer--;
                }
            }

            draw() {
                if (this.invulnerableTimer % 6 >= 3) return; // Flash effect when hit

                ctx.save();
                ctx.translate(this.x, this.y);

                // Engine Thruster Glow
                const thrusterHeight = Math.random() * 12 + 8;
                ctx.fillStyle = '#06b6d4';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#06b6d4';
                ctx.beginPath();
                ctx.moveTo(-8, this.height / 2 - 4);
                ctx.lineTo(0, this.height / 2 + thrusterHeight);
                ctx.lineTo(8, this.height / 2 - 4);
                ctx.closePath();
                ctx.fill();

                // Purple Wings Outer Glow
                ctx.strokeStyle = '#a855f7';
                ctx.lineWidth = 2.5;
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#a855f7';
                ctx.fillStyle = '#0d0722';

                // Futuristic Triangle Ship Path
                ctx.beginPath();
                ctx.moveTo(0, -this.height / 2); // Nose
                ctx.lineTo(this.width / 2, this.height / 2); // Right wing tip
                ctx.lineTo(this.width / 4, this.height / 3); // Right inner notch
                ctx.lineTo(-this.width / 4, this.height / 3); // Left inner notch
                ctx.lineTo(-this.width / 2, this.height / 2); // Left wing tip
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Inner Cyan Neon Highlights
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 1.5;
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#38bdf8';
                ctx.beginPath();
                ctx.moveTo(0, -this.height / 3);
                ctx.lineTo(this.width / 4, this.height / 4);
                ctx.moveTo(0, -this.height / 3);
                ctx.lineTo(-this.width / 4, this.height / 4);
                ctx.stroke();

                ctx.restore();
            }
        }

        class Laser {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.speed = 12;
                this.radius = 3;
                this.markedForDeletion = false;
            }

            update() {
                this.y -= this.speed;
                if (this.y < -10) this.markedForDeletion = true;
            }

            draw() {
                ctx.save();
                ctx.strokeStyle = '#06b6d4';
                ctx.fillStyle = '#ffffff';
                ctx.lineWidth = 3;
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#06b6d4';

                // Beam line
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x, this.y + 12);
                ctx.stroke();

                // Core tip
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        class Enemy {
            constructor() {
                this.width = 30;
                this.height = 30;
                this.x = Math.random() * (gameWidth - this.width) + this.width / 2;
                this.y = -20;
                this.speed = Math.random() * 2 + 2;
                this.markedForDeletion = false;
                this.rotation = 0;
                this.rotSpeed = (Math.random() - 0.5) * 0.05;
            }

            update() {
                this.y += this.speed;
                this.rotation += this.rotSpeed;
                if (this.y > gameHeight + 30) this.markedForDeletion = true;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);

                // Red Neon Glow Geometric Enemy Design
                ctx.strokeStyle = '#ef4444';
                ctx.fillStyle = '#210508';
                ctx.lineWidth = 2;
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#ef4444';

                // Inverted Neon Triangle/Diamond Shape
                ctx.beginPath();
                ctx.moveTo(0, this.height / 2); // Downward tip
                ctx.lineTo(-this.width / 2, -this.height / 2);
                ctx.lineTo(0, -this.height / 4);
                ctx.lineTo(this.width / 2, -this.height / 2);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Core Eye
                ctx.fillStyle = '#f87171';
                ctx.beginPath();
                ctx.arc(0, 0, 3, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.size = Math.random() * 3 + 1;
                this.speedX = (Math.random() - 0.5) * 6;
                this.speedY = (Math.random() - 0.5) * 6;
                this.alpha = 1;
                this.decay = Math.random() * 0.03 + 0.02;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Object containers
        let player = new Player();
        let lasers = [];
        let enemies = [];
        let particles = [];

        function createExplosion(x, y, color = '#ef4444', count = 18) {
            playExplosionSound();
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function checkCollisions() {
            // Laser vs Enemy Collision
            for (let l = lasers.length - 1; l >= 0; l--) {
                for (let e = enemies.length - 1; e >= 0; e--) {
                    const laser = lasers[l];
                    const enemy = enemies[e];

                    const dist = Math.hypot(laser.x - enemy.x, laser.y - enemy.y);
                    if (dist < enemy.width / 2 + laser.radius + 4) {
                        // Hit detected
                        createExplosion(enemy.x, enemy.y, '#ef4444', 15);
                        createExplosion(enemy.x, enemy.y, '#f97316', 8);

                        enemy.markedForDeletion = true;
                        laser.markedForDeletion = true;

                        score += 10;
                        scoreDisplay.textContent = score;
                        break;
                    }
                }
            }

            // Enemy vs Player Collision
            if (player.invulnerableTimer === 0) {
                for (let e = enemies.length - 1; e >= 0; e--) {
                    const enemy = enemies[e];
                    const dist = Math.hypot(player.x - enemy.x, player.y - enemy.y);

                    if (dist < (player.width / 2 + enemy.width / 2) * 0.8) {
                        enemy.markedForDeletion = true;
                        createExplosion(enemy.x, enemy.y, '#ef4444', 20);
                        createExplosion(player.x, player.y, '#a855f7', 25);

                        lives--;
                        updateLivesDisplay();
                        player.invulnerableTimer = 60; // 1 second invulnerability

                        if (lives <= 0) {
                            gameOver();
                        }
                        break;
                    }
                }
            }
        }

        function updateLivesDisplay() {
            let heartsHtml = '';
            for (let i = 0; i < lives; i++) {
                heartsHtml += '<span>♥</span>';
            }
            livesContainer.innerHTML = heartsHtml;
        }

        window.addEventListener('keydown', (e) => {
            initAudio();
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
            if (e.code === 'ArrowUp' || e.code === 'KeyW') keys.up = true;
            if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = true;
            if (e.code === 'Space') keys.space = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
            if (e.code === 'ArrowUp' || e.code === 'KeyW') keys.up = false;
            if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = false;
            if (e.code === 'Space') keys.space = false;
        });

        // Mouse & Touch Movement listeners
        function updatePointerPos(e) {
            initAudio();
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            touchX = clientX - rect.left;
            touchY = clientY - rect.top;
        }

        canvas.addEventListener('mousemove', (e) => {
            if (isPlaying) {
                isTouching = true;
                updatePointerPos(e);
            }
        });

        canvas.addEventListener('mouseleave', () => {
            isTouching = false;
            touchX = null;
            touchY = null;
        });

        canvas.addEventListener('touchstart', (e) => {
            initAudio();
            if (isPlaying) {
                isTouching = true;
                updatePointerPos(e);
            }
        }, { passive: true });

        canvas.addEventListener('touchmove', (e) => {
            if (isPlaying) {
                isTouching = true;
                updatePointerPos(e);
            }
        }, { passive: true });

        canvas.addEventListener('touchend', () => {
            isTouching = false;
            touchX = null;
            touchY = null;
        });

        function startNewGame() {
            initAudio();
            score = 0;
            lives = 3;
            lasers = [];
            enemies = [];
            particles = [];
            player = new Player();
            scoreDisplay.textContent = '0';
            updateLivesDisplay();

            startScreen.classList.add('hidden');
            gameoverScreen.classList.add('hidden');
            isPlaying = true;
        }

        function gameOver() {
            isPlaying = false;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('space_shooter_highscore', highScore);
                highscoreDisplay.textContent = highScore;
            }
            finalScore.textContent = score;
            finalHighscore.textContent = highScore;
            gameoverScreen.classList.remove('hidden');
        }

        startBtn.addEventListener('click', startNewGame);
        restartBtn.addEventListener('click', startNewGame);

        function gameLoop(timestamp) {
            // Clear Frame with semi-transparent black for motion trails
            ctx.fillStyle = 'rgba(5, 3, 10, 0.4)';
            ctx.fillRect(0, 0, gameWidth, gameHeight);

            // Render Stars
            stars.forEach(star => {
                star.update();
                star.draw();
            });

            if (isPlaying) {
                // Handle Shooting Logic
                shootTimer++;
                if ((keys.space || isTouching) && shootTimer > 12) {
                    lasers.push(new Laser(player.x - 10, player.y - 10));
                    lasers.push(new Laser(player.x + 10, player.y - 10));
                    playLaserSound();
                    shootTimer = 0;
                }

                // Handle Enemy Spawning Logic
                enemySpawnTimer++;
                const spawnInterval = Math.max(20, 60 - Math.floor(score / 40));
                if (enemySpawnTimer > spawnInterval) {
                    enemies.push(new Enemy());
                    enemySpawnTimer = 0;
                }

                // Update & Draw Player
                player.update();
                player.draw();

                // Update & Draw Lasers
                for (let i = lasers.length - 1; i >= 0; i--) {
                    lasers[i].update();
                    lasers[i].draw();
                    if (lasers[i].markedForDeletion) lasers.splice(i, 1);
                }

                // Update & Draw Enemies
                for (let i = enemies.length - 1; i >= 0; i--) {
                    enemies[i].update();
                    enemies[i].draw();
                    if (enemies[i].markedForDeletion) enemies.splice(i, 1);
                }

                // Update & Draw Particles
                for (let i = particles.length - 1; i >= 0; i--) {
                    particles[i].update();
                    particles[i].draw();
                    if (particles[i].alpha <= 0) particles.splice(i, 1);
                }

                // Check Collisions
                checkCollisions();
            }

            requestAnimationFrame(gameLoop);
        }

        // Start Animation Frame Loop
        window.onload = () => {
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
</html>
